<!DOCTYPE html>
<html lang="it">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilly</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
}

/* ANIMAZIONE ARCOBALENO PER IL GLOW E I BORDI */
@keyframes rainbowGlow {
    0% {
        border-color: #ff0000;
        box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000, inset 0 0 15px #ff0000;
    }
    16% {
        border-color: #ff7f00;
        box-shadow: 0 0 25px #ff7f00, 0 0 50px #ff7f00, inset 0 0 15px #ff7f00;
    }
    33% {
        border-color: #ffff00;
        box-shadow: 0 0 25px #ffff00, 0 0 50px #ffff00, inset 0 0 15px #ffff00;
    }
    50% {
        border-color: #00ff00;
        box-shadow: 0 0 25px #00ff00, 0 0 50px #00ff00, inset 0 0 15px #00ff00;
    }
    66% {
        border-color: #0000ff;
        box-shadow: 0 0 25px #0000ff, 0 0 50px #0000ff, inset 0 0 15px #0000ff;
    }
    83% {
        border-color: #4b0082;
        box-shadow: 0 0 25px #4b0082, 0 0 50px #4b0082, inset 0 0 15px #4b0082;
    }
    100% {
        border-color: #8b00ff;
        box-shadow: 0 0 25px #8b00ff, 0 0 50px #8b00ff, inset 0 0 15px #8b00ff;
    }
}

/* ANIMAZIONE ARCOBALENO PER IL TESTO */
@keyframes rainbowText {
    0% {
        color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 0 0 25px #ff0000, 0 0 35px #ffffff;
    }
    16% {
        color: #ff7f00;
        text-shadow: 0 0 10px #ff7f00, 0 0 25px #ff7f00, 0 0 35px #ffffff;
    }
    33% {
        color: #ffff00;
        text-shadow: 0 0 10px #ffff00, 0 0 25px #ffff00, 0 0 35px #ffffff;
    }
    50% {
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00, 0 0 25px #00ff00, 0 0 35px #ffffff;
    }
    66% {
        color: #0000ff;
        text-shadow: 0 0 10px #0000ff, 0 0 25px #0000ff, 0 0 35px #ffffff;
    }
    83% {
        color: #4b0082;
        text-shadow: 0 0 10px #4b0082, 0 0 25px #4b0082, 0 0 35px #ffffff;
    }
    100% {
        color: #8b00ff;
        text-shadow: 0 0 10px #8b00ff, 0 0 25px #8b00ff, 0 0 35px #ffffff;
    }
}

/* CONTENITORI VIDEO */
.video-box {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 14px;
    border: 3px solid #ff0000;
    overflow: hidden;
    z-index: 9999;
    background: transparent;
    animation: rainbowGlow 4s linear infinite;
}

/* POSIZIONE */
.video-left {
    left: 50px;
}

.video-right {
    right: 50px;
}

/* VIDEO */
.video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TESTO */
.video-text {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    pointer-events: none;
    animation: wave 3s ease-in-out infinite, rainbowText 4s linear infinite;
}

/* ANIMAZIONE ONDA */
@keyframes wave {
    0% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        transform: translateY(-4px) rotate(-1deg);
    }
    50% {
        transform: translateY(0) rotate(0deg);
    }
    75% {
        transform: translateY(4px) rotate(1deg);
    }
    100% {
        transform: translateY(0) rotate(0deg);
    }
}
</style>
</head>

<body>

<!-- VIDEO SINISTRO -->
<div class="video-box video-left">
    <video id="videoLeft" autoplay muted playsinline></video>
    <div class="video-text">FANTASY-MUSIC</div>
</div>

<!-- VIDEO DESTRO -->
<div class="video-box video-right">
    <video id="videoRight" autoplay muted playsinline></video>
    <div class="video-text">FANTASY-MUSIC</div>
</div>


<script>

/* =========================================================
   LISTA VIDEO
   ========================================================= */

var videoSinistra = [
    "https://i.imgur.com/PRHcCna.mp4",
    "https://i.imgur.com/eYTFKTA.mp4",
    "https://i.imgur.com/NlQtyuX.mp4",
    "https://i.imgur.com/Y7zoZSu.mp4",
    "https://i.imgur.com/dMOxwO4.mp4",
    "https://i.imgur.com/xbfZjDz.mp4"
];

var videoDestra = [
    "https://i.imgur.com/boyoeUf.mp4",
    "https://i.imgur.com/ZZs4DNe.mp4",
    "https://i.imgur.com/dMOxwO4.mp4",
    "https://i.imgur.com/Fi2HXgv.mp4",
    "https://i.imgur.com/NlQtyuX.mp4",
    "https://i.imgur.com/G2KS2lN.mp4"
];

var videoLeft = document.getElementById("videoLeft");
var videoRight = document.getElementById("videoRight");

var indiceSinistra = 0;
var indiceDestra = 2;


/* CARICA E RIProduci VIDEO SINISTRO */
function caricaVideoSinistra() {
    videoLeft.src = videoSinistra[indiceSinistra];
    videoLeft.load();
    var promessa = videoLeft.play();
    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


/* CARICA E RIPRODUCI VIDEO DESTRO */
function caricaVideoDestra() {
    videoRight.src = videoDestra[indiceDestra];
    videoRight.load();
    var promessa = videoRight.play();
    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


/* AVVIO INIZIALE */
caricaVideoSinistra();
caricaVideoDestra();


/* GESTIONE LOOP VIDEO NEL CASO DURINO MENO DI 30 MINUTI */
videoLeft.onended = function() {
    videoLeft.play();
};

videoRight.onended = function() {
    videoRight.play();
};


/* =========================================================
   CAMBIO AUTOMATICO OGNI 30 MINUTI ESATTI
   30 MINUTI = 1.800.000 MILLISECONDI
   ========================================================= */

setInterval(function() {
    // Cambia indice sinistra
    indiceSinistra++;
    if (indiceSinistra >= videoSinistra.length) {
        indiceSinistra = 0;
    }
    caricaVideoSinistra();

    // Cambia indice destra
    indiceDestra++;
    if (indiceDestra >= videoDestra.length) {
        indiceDestra = 0;
    }
    caricaVideoDestra();

}, 30 * 60 * 1000);


/* =========================================================
   PROTEZIONE CONTRO COPIA / TASTO DESTRO
   ========================================================= */

var message = "no copy";

document.oncontextmenu = function() {
    alert(message);
    return false;
};

document.onmousedown = function(e) {
    if (e.button == 2 || e.button == 3) {
        alert(message);
        return false;
    }
};

document.onselectstart = function() {
    return false;
};

</script>

</body>
</html>
