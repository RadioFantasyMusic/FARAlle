<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Ultra Neon TRILLY Glow</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent !important;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .container {
    position: relative;
    width: 1308px;
    height: 484px;
    background: transparent;
  }

  /* L'ANIMA DEL FLORESCENTE: Condivisa tra Trilly e FantasyMusic */
  @keyframes ultraGlow {
    0%, 100% { 
      filter: 
        drop-shadow(0 0 10px #fff) 
        drop-shadow(0 0 20px #ff0000) 
        drop-shadow(0 0 40px #ff00ff)
        drop-shadow(0 0 80px #ff0000);
      background-position: 0% 50%;
    }
    50% {
      filter: 
        drop-shadow(0 0 15px #fff) 
        drop-shadow(0 0 30px #00ff00) 
        drop-shadow(0 0 60px #00ffff)
        drop-shadow(0 0 100px #00ff00);
      background-position: 100% 50%;
    }
  }

  @keyframes rotateHue {
    to { filter: hue-rotate(360deg); }
  }

  /* Wrapper Video */
  .video-wrapper {
    position: absolute;
    width: 270px;
    height: 484px;
    z-index: 2;
    border-radius: 20px;
    background: transparent;
  }
  .left { left: 0; }
  .right { right: 0; }

  .video-wrapper::before {
    content: "";
    position: absolute;
    inset: -5px;
    padding: 6px;
    border-radius: 25px;
    background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: rotateHue 2s linear infinite;
    filter: blur(1px) drop-shadow(0 0 15px rgba(255,255,255,0.8));
  }

  .side-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  /* FANTASYMUSIC: Ora ha lo stesso effetto di Trilly */
  .video-text {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    font-family: 'Arial Black', sans-serif;
    font-weight: 900;
    white-space: nowrap;
    background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    /* Animazione UltraGlow aggiunta qui */
    animation: ultraGlow 2s linear infinite; 
    text-shadow: 0 0 5px rgba(255,255,255,0.3);
  }

  .center-area {
    position: absolute;
    left: 280px;
    right: 280px;
    top: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .center-box {
    position: relative;
    width: 450px;
    animation: pulseFade 5s ease-in-out infinite;
  }

  .center-box img {
    width: 100%;
    border-radius: 30px;
    filter: brightness(1.1) drop-shadow(0 0 20px rgba(255,255,255,0.2));
  }

  /* TRILLY: Effetto Florescente */
  .center-title {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 75px; 
    font-family: 'Arial Black', sans-serif;
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: ultraGlow 2s linear infinite;
    white-space: nowrap;
  }

  @keyframes pulseFade {
    0%, 100% { opacity: 0; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="container">
  <div class="video-wrapper left">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://radiofantasymusic.github.io/FARAlle//gif1.gif" type="video/gif">
    </video>
    <div class="video-text">FantasyMusic</div>
  </div>

  <div class="video-wrapper right">
    <video class="side-video" autoplay loop muted playsinline>
      <source src="https://radiofantasymusic.github.io/FARAlle//ngif1.gif" type="video/gif">
    </video>
    <div class="video-text">FantasyMusic</div>
  </div>

  <div class="center-area">
    <div class="center-box">
      <img src="https://xatimg.com/image/BX8iEoBa8wcO.png" alt="Trilly Center">
      <div class="center-title">Trilly</div>
    </div>
  </div>
</div>

</body>
</html>
