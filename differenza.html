<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>2 OFFICIAL - Smart Auto-Timer Layout</title>
  <style>
    body { 
      margin: 0;
      background: transparent; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      overflow: hidden; 
      font-family: Arial, sans-serif;
    }
    
    .container { 
      position: relative; 
      display: flex;
      justify-content: space-between; 
      align-items: center; 
      width: 100%; 
      height: 100vh; 
      padding: 0 20px; 
      box-sizing: border-box;
    }
    
    .colonna-sx {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .colonna-dx {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }

    .wrapper { 
      position: relative; 
      overflow: hidden; 
      border-radius: 22px;
      width: 270px;
      height: 484px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    @keyframes rainbow-bg { 
      0% { background-position: 0% 50%; } 
      100% { background-position: 200% 50%; } 
    }
    @keyframes pulsante { 
      0% { transform: scale(1); opacity: 0.9; } 
      50% { transform: scale(1.03); opacity: 1; } 
      100% { transform: scale(1); opacity: 0.9; } 
    }
    .pulsing { animation: pulsante 2s ease-in-out infinite; }

    .wrapper::after {
      content: ""; position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; box-sizing: border-box; border: 9px solid transparent; border-radius: 22px;
      background: linear-gradient(90deg, #ff0000, #ffaa00, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude; background-size: 200%; animation: rainbow-bg 3s linear infinite; z-index: 10; pointer-events: none;
    }

    /* Struttura base dell'arcobaleno pulita */
    .testo-arcobaleno { 
      background: linear-gradient(90deg, #ff0055, #ffaa00, #ffff00, #00ffaa, #00aaff, #ff00ff, #ff0055); 
      background-size: 200%; 
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent; 
      animation: rainbow-bg 3s linear infinite; 
      display: inline-block;
      width: 100%;
    }

    .left { 
      background-image: url('https://i.imgur.com/HTNj0v8.gif');
      background-size: cover; 
      background-position: center;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
    }
    
    .right { 
      background-image: url('https://i.imgur.com/HTNj0v8.gif');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      text-align: center;
    }

    /* MODIFICATO: Questo box gestisce SOLO l'ombra e la posizione per non rompere l'arcobaleno */
    .testo-dinamico-box { 
      font-family: 'Arial Black', sans-serif; 
      font-size: 24px; 
      font-weight: 900;
      z-index: 20; 
      line-height: 1.3;
      width: 90%;
      box-sizing: border-box;
      cursor: pointer;
      text-align: center;
      filter: drop-shadow(2px 2px 1px #000) drop-shadow(-2px -2px 1px #000) drop-shadow(0px 4px 6px rgba(0,0,0,0.8));
    }

    /* NUOVO: Elemento interno protetto che genera l'effetto sfumato continuo senza bug */
    .testo-arcobaleno-reale {
      background: linear-gradient(90deg, #ff0055, #ffaa00, #ffff00, #00ffaa, #00aaff, #ff00ff, #ff0055);
      background-size: 200%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow-bg 3s linear infinite;
      display: block;
      width: 100%;
    }

    .saluto-testo { font-family: 'Arial Black', sans-serif; font-size: 20px; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; }
    .orario-grande { font-family: 'Arial Black', sans-serif; font-size: 55px; font-weight: 900; margin-bottom: 5px; }
    
    .btn-ascolta { 
      position: absolute; 
      top: -35px;
      background: rgba(0, 0, 0, 0.9); 
      border: 2px solid #00ffff; 
      border-radius: 8px; 
      padding: 6px 14px; 
      color: white; 
      font-family: 'Arial Black', sans-serif;
      font-size: 12px; 
      cursor: pointer; 
      text-transform: uppercase; 
      box-shadow: 0 0 10px rgba(0, 255, 255, 0.4); 
      transition: all 0.3s ease; 
      pointer-events: auto;
    }
    .btn-ascolta:hover { background: rgba(0, 255, 255, 0.2); transform: scale(1.05); }
  </style>
</head>
<body>

<div class="container">
  <div class="colonna-sx">
    <div class="wrapper left">
      <div id="saluto-fisso" class="saluto-testo testo-arcobaleno">...</div>
      <div id="orario-grande" class="orario-grande testo-arcobaleno">00:00</div>
      <div class="data-info" style="color:#fff; text-align: center;">
        <div id="data-estesa">...</div>
        <div id="citta-visitatore" class="citta-box" style="color:#00ffff; font-weight:bold; width:100%; text-align:left; padding-left:12px; box-sizing:border-box;">Caricamento città...</div>
      </div>
    </div>
  </div>

  <div class="colonna-dx">
    <button id="tasto-audio" class="btn-ascolta">OFF AUDIO</button>
    <div class="wrapper right" onclick="parlaTesto()">
      <div id="testo-centro-box" class="testo-dinamico-box pulsing">
        <span class="testo-arcobaleno-reale">...</span>
      </div>
    </div>
  </div>
</div>

<audio id="sigla-audio" src="" loop></audio>

<script>
  const audioSigla = document.getElementById('sigla-audio');
  const testoCentroBox = document.getElementById('testo-centro-box');
  const tastoAudio = document.getElementById('tasto-audio');
  const cittaVisitatore = document.getElementById('citta-visitatore');
  
  let lastSaluto = "";
  let timerMute;
  let testoDaLeggere = "";
  let sbloccatoDallUtente = false;

  function rilevaCitta() {
    fetch('https://get.geojs.io/v1/ip/geo.json')
      .then(response => response.json())
      .then(data => {
        if (data.city && data.country) {
          cittaVisitatore.innerText = data.city + ", " + data.country;
        } else {
          cittaVisitatore.innerText = "Città non trovata";
        }
      })
      .catch(error => {
        console.log("Errore API città:", error);
        cittaVisitatore.innerText = "Ospite Online"; 
      });
  }

  rilevaCitta();

  function parlaTesto() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); 

      if (!testoDaLeggere) return;

      const messaggio = new SpeechSynthesisUtterance(testoDaLeggere);
      messaggio.lang = 'it-IT';
      messaggio.rate = 0.95; 
      messaggio.pitch = 1.25; 

      const voci = window.speechSynthesis.getVoices();
      let voceSelezionata = voci.find(v => v.lang.includes('it') && 
        (v.name.toLowerCase().includes('elsa') || 
         v.name.toLowerCase().includes('alice') || 
         v.name.toLowerCase().includes('google') || 
         v.name.toLowerCase().includes('female') ||
         v.name.toLowerCase().includes('microsoft')));

      if (!voceSelezionata) {
        voceSelezionata = voci.find(v => v.lang.includes('it'));
      }

      if (voceSelezionata) {
        messaggio.voice = voceSelezionata;
      }

      window.speechSynthesis.speak(messaggio);
    }
  }

  if ('speechSynthesis' in window) {
    if (window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => {
        if(sbloccatoDallUtente) parlaTesto();
      };
    }
  }

  function updateData() {
    const now = new Date();
    const hour = now.getHours();
    
    document.getElementById('orario-grande').innerText = now.toLocaleTimeString('it-IT', {hour: '2-digit', minute:'2-digit'});
    document.getElementById('data-estesa').innerText = now.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    let saluto = "";
    let testoVisivo = ""; 

    if (hour >= 10 && hour < 14) {
      saluto = "Interagisci";
      testoVisivo = "Oggi Sono Felice o Fatto Tutto";
    } else if (hour >= 14 && hour < 19) {
      saluto = "Buon pomeriggio";
      testoVisivo = "Fantasy Music vi augura buon pomeriggio";
    } else if (hour >= 19 && hour < 24) {
      saluto = "Grazie";
      testoVisivo = "Fantasticamente      insieme  !!!";
    } else {
      saluto = "Fantasy music";
      testoVisivo = "Benvenuti    la   radio  che fa  la differenza";
    }
    
    if (saluto !== lastSaluto) {
      document.getElementById('saluto-fisso').innerText = saluto.toUpperCase();
      
      // MODIFICATO: Iniettiamo il testo mantenendo intatta la struttura dello span arcobaleno
      testoCentroBox.innerHTML = `<span class="testo-arcobaleno-reale">${testoVisivo}</span>`; 
      
      testoDaLeggere = testoVisivo; 
      lastSaluto = saluto;
      
      if (sbloccatoDallUtente) {
        parlaTesto();
      }
    }
  }
  
  function avviaTimerSigla() {
    audioSigla.play().then(() => {
      tastoAudio.innerText = "OFF AUDIO";
      sbloccatoDallUtente = true;
      parlaTesto();
    }).catch(e => {
      console.log("Autoplay bloccato.");
      tastoAudio.innerText = "ON AUDIO";
    });

    clearTimeout(timerMute);
    timerMute = setTimeout(() => {
      audioSigla.muted = true;
      tastoAudio.innerText = "ON AUDIO";
    }, 120000); 
  }

  tastoAudio.addEventListener('click', (e) => {
    e.stopPropagation(); 
    sbloccatoDallUtente = true;
    
    audioSigla.muted = true;
    tastoAudio.innerText = "ON AUDIO";
    
    parlaTesto();
  });

  document.addEventListener('click', () => {
    if(!sbloccatoDallUtente) {
      sbloccatoDallUtente = true;
      parlaTesto();
    }
  }, { once: true });

  updateData();
  setInterval(updateData, 1000);
  avviaTimerSigla();
</script>
</body>
</html>
