<!DOCTYPE html>

<head>

<title>2 OFFICIAL</title>

<style>

body{

}

.container{

padding:0 20px;

.wrapper{

background:

center/cover;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

overflow:hidden;

)

border-box;

background-size:200%;

animation:arcobaleno 3s linear infinite;

-webkit-mask:
linear-gradient(#fff 0 0)
padding-box,
linear-gradient(#fff 0 0);

-webkit-mask-composite:
destination-out;

}

@keyframes arcobaleno{

0%{
background-position:0%;
}

100%{
background-position:200%;
}

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.03);
}

100%{
transform:scale(1);
}

}

.pulse{

animation:
pulse
2s
infinite;

}

.rainbow{

background:
linear-gradient(
90deg,
#ff0055,
orange,
yellow,
#00ffaa,
#00aaff,
magenta
);

background-size:200%;

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

animation:

}

</head>

<body>

<div class="container">

<div class="wrapper">

<div class="rainbow">
BENVENUTI
</div>

<div
id="ora"
class="orario rainbow">
00:00
</div>

<div
id="data"
class="data">
Caricamento...
</div>

<div
id="meteo"
class="meteo">
Caricamento meteo...
</div>

</div>


<div
class="wrapper"

onclick="leggi()">

<div
id="testo"

class="testo pulse">

TOCCA

</div>

<div
id="voce"

class="info">

Caricando voce...

</div>

</div>

</div>


<script>

let frase="";

let voceScelta=null;

let timers=[];

function aggiorna(){

let n=
new Date();

ora.innerHTML=
n.toLocaleTimeString(
"it-IT",
{
hour:"2-digit",
minute:"2-digit"
}
);

data.innerHTML=
n.toLocaleDateString(
"it-IT",
{
weekday:"long",
day:"numeric",
month:"long"
}
);

let h=
n.getHours();

if(h<14)
frase=
"Oggi sono felice, ho fatto tutto.";

else if(h<19)
frase=
"Fantasy Music vi augura un buon pomeriggio.";

else
frase=
"Benvenuti nella radio che fa la differenza.";

}

setInterval(
aggiorna,
1000
);

aggiorna();



function scegliVoce(){

let v=
speechSynthesis
.getVoices();

voceScelta=

v.find(
x=>
x.lang.startsWith("it")
&&
/google/i
.test(x.name)
)

||

v.find(
x=>
x.lang.startsWith("it")
);

if(voceScelta){

voce.innerHTML=

"Voce: "

+

voceScelta.name;

}

}

speechSynthesis.onvoiceschanged=
scegliVoce;

scegliVoce();



function parla(t){

speechSynthesis.cancel();

setTimeout(()=>{

let s=
new SpeechSynthesisUtterance(
t
);

s.lang=
"it-IT";

s.rate=
0.95;

if(voceScelta)
s.voice=
voceScelta;

window.keep=s;

speechSynthesis.speak(
s
);

},250);

}



function leggi(){

timers.forEach(
clearTimeout
);

timers=[];

testo.innerHTML=

`<span class="rainbow">

${frase}

</span>`;

parla(frase);

timers.push(
setTimeout(
()=>parla(frase),
4200
)
);

timers.push(
setTimeout(
()=>parla(frase),
8400
)
);

timers.push(
setTimeout(
()=>{
testo.innerHTML="";
},
13000
)
);

}



async function caricaMeteo(){

try{

if(
!navigator.geolocation
){

meteo.innerHTML=
"Meteo OFF";

return;

}

navigator.geolocation.getCurrentPosition(

async p=>{

let r=

await fetch(

`https://wttr.in/${p.coords.latitude},${p.coords.longitude}?format=j1`

);

let j=
await r.json();

let c=
j.current_condition[0];

meteo.innerHTML=

`${c.temp_C}°C · ${c.weatherDesc[0].value}`;

}

);

}

catch{

meteo.innerHTML=
"meteo";

}

}

caricaMeteo();

</script>

</body>
</html>
