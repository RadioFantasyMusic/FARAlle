<!DOCTYPE html>
<html lang="it">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilly</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
}

/* ANIMAZIONE ARCOBALENO POTENZIATA PER IL GLOW E I BORDI */
@keyframes rainbowGlow {
    0% {
        border-color: #ff0000;
        box-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 60px #ff0000, 0 0 90px #ff0000, inset 0 0 25px #ff0000, inset 0 0 50px #ff0000;
    }
    16% {
        border-color: #ff7f00;
        box-shadow: 0 0 15px #ff7f00, 0 0 30px #ff7f00, 0 0 60px #ff7f00, 0 0 90px #ff7f00, inset 0 0 25px #ff7f00, inset 0 0 50px #ff7f00;
    }
    33% {
        border-color: #ffff00;
        box-shadow: 0 0 15px #ffff00, 0 0 30px #ffff00, 0 0 60px #ffff00, 0 0 90px #ffff00, inset 0 0 25px #ffff00, inset 0 0 50px #ffff00;
    }
    50% {
        border-color: #00ff00;
        box-shadow: 0 0 15px #00ff00, 0 0 30px #00ff00, 0 0 60px #00ff00, 0 0 90px #00ff00, inset 0 0 25px #00ff00, inset 0 0 50px #00ff00;
    }
    66% {
        border-color: #0000ff;
        box-shadow: 0 0 15px #0000ff, 0 0 30px #0000ff, 0 0 60px #0000ff, 0 0 90px #0000ff, inset 0 0 25px #0000ff, inset 0 0 50px #0000ff;
    }
    83% {
        border-color: #4b0082;
        box-shadow: 0 0 15px #4b0082, 0 0 30px #4b0082, 0 0 60px #4b0082, 0 0 90px #4b0082, inset 0 0 25px #4b0082, inset 0 0 50px #4b0082;
    }
    100% {
        border-color: #8b00ff;
        box-shadow: 0 0 15px #8b00ff, 0 0 30px #8b00ff, 0 0 60px #8b00ff, 0 0 90px #8b00ff, inset 0 0 25px #8b00ff, inset 0 0 50px #8b00ff;
    }
}

/* ANIMAZIONE ARCOBALENO POTENZIATA PER IL TESTO */
@keyframes rainbowText {
    0% {
        color: #ff0000;
        text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #ff0000, 0 0 70px #ff0000, 0 0 90px #ffffff;
    }
    16% {
        color: #ff7f00;
        text-shadow: 0 0 10px #ff7f00, 0 0 20px #ff7f00, 0 0 40px #ff7f00, 0 0 70px #ff7f00, 0 0 90px #ffffff;
    }
    33% {
        color: #ffff00;
        text-shadow: 0 0 10px #ffff00, 0 0 20px #ffff00, 0 0 40px #ffff00, 0 0 70px #ffff00, 0 0 90px #ffffff;
    }
    50% {
        color: #00ff00;
        text-shadow: 0 0 10px #00ff00, 0 0 20px #00ff00, 0 0 40px #00ff00, 0 0 70px #00ff00, 0 0 90px #ffffff;
    }
    66% {
        color: #0000ff;
        text-shadow: 0 0 10px #0000ff, 0 0 20px #0000ff, 0 0 40px #0000ff, 0 0 70px #0000ff, 0 0 90px #ffffff;
    }
    83% {
        color: #4b0082;
        text-shadow: 0 0 10px #4b0082, 0 0 20px #4b0082, 0 0 40px #4b0082, 0 0 70px #4b0082, 0 0 90px #ffffff;
    }
    100% {
        color: #8b00ff;
        text-shadow: 0 0 10px #8b00ff, 0 0 20px #8b00ff, 0 0 40px #8b00ff, 0 0 70px #8b00ff, 0 0 90px #ffffff;
    }
}

/* CONTENITORI VIDEO */
.video-box {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 14px;
    border: 4px solid #ff0000;
    overflow: hidden;
    z-index: 9999;
    background: transparent;
    animation: rainbowGlow 4s linear infinite;
}

/* POSIZIONE */
.video-left {
    left: 10px;
}

.video-right {
    right: 10px;
}

/* VIDEO */
.video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TESTO */
.video-text {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    pointer-events: none;
    animation: wave 3s ease-in-out infinite, rainbowText 4s linear infinite;
}

/* ANIMAZIONE ONDA */
@keyframes wave {
    0% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        transform: translateY(-4px) rotate(-1deg);
    }
    50% {
        transform: translateY(0) rotate(0deg);
    }
    75% {
        transform: translateY(4px) rotate(1deg);
    }
    100% {
        transform: translateY(0) rotate(0deg);
    }
}
</style>
</head>

<body>

<!-- VIDEO SINISTRO -->
<div class="video-box video-left">
    <video id="videoLeft" autoplay muted playsinline></video>
    <div class="video-text">FANTASY-MUSIC</div>
</div>

<!-- VIDEO DESTRO -->
<div class="video-box video-right">
    <video id="videoRight" autoplay muted playsinline></video>
    <div class="video-text">FANTASY-MUSIC</div>
</div>


<script>

/* =========================================================
   VIDEO SINISTRA
   6 VIDEO - CAMBIO OGNI 30 MINUTI
   ========================================================= */

var videoSinistra = [
    "https://i.imgur.com/PRHcCna.mp4",
    "https://i.imgur.com/eYTFKTA.mp4",
    "https://i.imgur.com/NlQtyuX.mp4",
    "https://i.imgur.com/Y7zoZSu.mp4",
    "https://i.imgur.com/dMOxwO4.mp4",
    "https://i.imgur.com/xbfZjDz.mp4"
];


/* =========================================================
   VIDEO DESTRA
   6 VIDEO - CAMBIO OGNI 30 MINUTI
   ========================================================= */

var videoDestra = [
    "https://i.imgur.com/boyoeUf.mp4",
    "https://i.imgur.com/ZZs4DNe.mp4",
    "https://i.imgur.com/dMOxwO4.mp4",
    "https://i.imgur.com/Fi2HXgv.mp4",
    "https://i.imgur.com/NlQtyuX.mp4",
    "https://i.imgur.com/G2KS2lN.mp4"
];


var videoLeft = document.getElementById("videoLeft");
var videoRight = document.getElementById("videoRight");

var indiceSinistra = 0;
var indiceDestra = 2;


function caricaVideoSinistra() {
    videoLeft.src = videoSinistra[indiceSinistra];
    videoLeft.load();
    var promessa = videoLeft.play();
    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


function caricaVideoDestra() {
    videoRight.src = videoDestra[indiceDestra];
    videoRight.load();
    var promessa = videoRight.play();
    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


caricaVideoSinistra();
caricaVideoDestra();


setInterval(function() {
    indiceSinistra++;
    if (indiceSinistra >= videoSinistra.length) {
        indiceSinistra = 0;
    }
    caricaVideoSinistra();

    indiceDestra++;
    if (indiceDestra >= videoDestra.length) {
        indiceDestra = 0;
    }
    caricaVideoDestra();

}, 30 * 60 * 1000);


var message = "no copy";

function clickIE4() {
    if (event.button == 2) {
        alert(message);
        return false;
    }
}

function clickNS4(e) {
    if (document.layers || (document.getElementById && !document.all)) {
        if (e.which == 2 || e.which == 3) {
            alert(message);
            return false;
        }
    }
}

if (document.layers) {
    document.captureEvents(Event.MOUSEDOWN);
    document.onmousedown = clickNS4;
} else if (document.all && !document.getElementById) {
    document.onmousedown = clickIE4;
}

document.oncontextmenu = function() {
    alert(message);
    return false;
};


function disableselect(e) {
    return false;
}

function reEnable() {
    return true;
}

document.onselectstart = function() {
    return false;
};

if (window.sidebar) {
    document.onmousedown = disableselect;
    document.onclick = reEnable;
}

</script>

</body>
</html>
