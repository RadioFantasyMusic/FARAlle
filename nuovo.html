
<!DOCTYPE html>
<html lang="it">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilly</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
}

/* CONTENITORI VIDEO */
.video-box {
    position: fixed;
    width: 240px;
    height: 520px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 14px;
    border: 2px solid #8B0000;
    box-shadow: 0 0 20px #000001, 0 0 40px #8B0000;
    overflow: hidden;
    z-index: 9999;
    background: transparent;
}

/* POSIZIONE */
.video-left {
    left: 10px;
}

.video-right {
    right: 10px;
}

/* VIDEO */
.video-box video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TESTO */
.video-text {
    position: absolute;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #8B0000;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 8px #8B0000, 0 0 15px #000001;
    pointer-events: none;
    animation: wave 3s ease-in-out infinite;
}

/* ANIMAZIONE ONDA */
@keyframes wave {
    0% {
        transform: translateY(0) rotate(0deg);
    }
    25% {
        transform: translateY(-4px) rotate(-1deg);
    }
    50% {
        transform: translateY(0) rotate(0deg);
    }
    75% {
        transform: translateY(4px) rotate(1deg);
    }
    100% {
        transform: translateY(0) rotate(0deg);
    }
}
</style>
</head>

<body>

<!-- VIDEO SINISTRO -->
<div class="video-box video-left">
    <video id="videoLeft" autoplay muted playsinline></video>
    <div class="video-text">FANTASY-MUSIC</div>
</div>

<!-- VIDEO DESTRO -->
<div class="video-box video-right">
    <video id="videoRight" autoplay muted playsinline></video>
    <div class="video-text">FANTASY-MUSIC</div>
</div>


<script>

/* =========================================================
   VIDEO SINISTRA
   6 VIDEO - CAMBIO OGNI 30 MINUTI
   ========================================================= */

var videoSinistra = [

    "https://i.imgur.com/PRHcCna.mp4",

    /* VIDEO 2 */
    "https://i.imgur.com/eYTFKTA.mp4",

    /* VIDEO 3 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/NlQtyuX.mp4",

    /* VIDEO 4 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/Y7zoZSu.mp4",

    /* VIDEO 5 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/dMOxwO4.mp4",

    /* VIDEO 6 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/xbfZjDz.mp4"
];


/* =========================================================
   VIDEO DESTRA
   6 VIDEO - CAMBIO OGNI 30 MINUTI
   ========================================================= */

var videoDestra = [

    "https://i.imgur.com/boyoeUf.mp4",

    /* VIDEO 2 */
    "https://i.imgur.com/ZZs4DNe.mp4",

    /* VIDEO 3 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/dMOxwO4.mp4",

    /* VIDEO 4 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/Fi2HXgv.mp4",

    /* VIDEO 5 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/NlQtyuX.mp4",

    /* VIDEO 6 - INSERISCI IL TUO LINK */
    "https://i.imgur.com/G2KS2lN.mp4"
];


var videoLeft = document.getElementById("videoLeft");
var videoRight = document.getElementById("videoRight");

var indiceSinistra = 0;
var indiceDestra = 0;


/* CARICA VIDEO SINISTRO */
function caricaVideoSinistra() {

    videoLeft.src = videoSinistra[indiceSinistra];
    videoLeft.load();

    var promessa = videoLeft.play();

    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


/* CARICA VIDEO DESTRO */
function caricaVideoDestra() {

    videoRight.src = videoDestra[indiceDestra];
    videoRight.load();

    var promessa = videoRight.play();

    if (promessa !== undefined) {
        promessa.catch(function() {});
    }
}


/* AVVIO */
caricaVideoSinistra();
caricaVideoDestra();


/* =========================================================
   CAMBIO OGNI 30 MINUTI
   30 MINUTI = 1.800.000 MILLISECONDI
   ========================================================= */

setInterval(function() {

    /* CAMBIA SINISTRA */
    indiceSinistra++;

    if (indiceSinistra >= videoSinistra.length) {
        indiceSinistra = 0;
    }

    caricaVideoSinistra();


    /* CAMBIA DESTRA */
    indiceDestra++;

    if (indiceDestra >= videoDestra.length) {
        indiceDestra = 0;
    }

    caricaVideoDestra();

}, 30 * 60 * 1000);


/* =========================================================
   NO COPY / NO TASTO DESTRO
   ========================================================= */

var message = "no copy";

function clickIE4() {
    if (event.button == 2) {
        alert(message);
        return false;
    }
}

function clickNS4(e) {
    if (
        document.layers ||
        document.getElementById && !document.all
    ) {
        if (e.which == 2 || e.which == 3) {
            alert(message);
            return false;
        }
    }
}

if (document.layers) {
    document.captureEvents(Event.MOUSEDOWN);
    document.onmousedown = clickNS4;
}
else if (document.all && !document.getElementById) {
    document.onmousedown = clickIE4;
}

document.oncontextmenu = function() {
    alert(message);
    return false;
};


/* =========================================================
   BLOCCO SELEZIONE
   ========================================================= */

function disableselect(e) {
    return false;
}

function reEnable() {
    return true;
}

document.onselectstart = function() {
    return false;
};

if (window.sidebar) {
    document.onmousedown = disableselect;
    document.onclick = reEnable;
}

</script>

</body>
</html>
