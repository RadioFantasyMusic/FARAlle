<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
margin:0;
padding:0;
background:transparent;
overflow:hidden;
font-family:sans-serif;
}

/* ===== RAINBOW ===== */
:root{
--rainbow:linear-gradient(90deg,
#ff00ea,#ff0000,#ff8c00,#ffee00,
#00ff00,#00ffff,#0011ff,#ff00ea);
}

/* ===== VIDEO BOX ===== */
.video-box{
position:fixed;
width:240px;
height:520px;
top:50%;
transform:translateY(-50%);
border-radius:20px;
overflow:hidden;
z-index:5;
animation:float 8s ease-in-out infinite alternate;
}

.left{ left:30px; }
.right{ right:30px; }

.video-box::before{
content:"";
position:absolute;
inset:0;
padding:4px;
border-radius:20px;
background:var(--rainbow);
background-size:400% 400%;
animation:rainbowMove 6s linear infinite,pulse 2s ease-in-out infinite;
-webkit-mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
-webkit-mask-composite:xor;
mask-composite:exclude;
filter:blur(3px) brightness(1.7);
pointer-events:none;
}

video{
width:100%;
height:100%;
object-fit:cover;
}

.text{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
font-size:28px;
font-weight:bold;
text-transform:uppercase;
background:var(--rainbow);
background-size:400% 400%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
filter:drop-shadow(0 0 6px #fff)
drop-shadow(0 0 20px #00ffff);
animation:rainbowMove 6s linear infinite,liquid 3s ease-in-out infinite;
}

/* ===== FOTO CENTRALE AGGIORNATA ===== */

.center-area{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:10;
pointer-events:none;
}

.center-area img{
width:260px;
height:auto;
/* Applichiamo la nuova animazione combinata */
animation: superFancy 5s ease-in-out infinite alternate;
}

/* ===== ANIMAZIONI ===== */

/* Nuova animazione: Fade + Zoom + Glow pulsante */
@keyframes superFancy {
  0% {
    opacity: 0.3;
    transform: scale(0.9) rotate(-2deg);
    filter: drop-shadow(0 0 5px rgba(255,255,255,0.2));
  }
  50% {
    opacity: 1;
    filter: drop-shadow(0 0 25px rgba(0, 255, 255, 0.8));
  }
  100% {
    opacity: 0.7;
    transform: scale(1.1) rotate(2deg);
    filter: drop-shadow(0 0 15px rgba(255, 0, 234, 0.6));
  }
}

@keyframes rainbowMove{
0%{background-position:0%}
100%{background-position:400%}
}

@keyframes float{
0%{transform:translateY(-55%) translateX(-10px) rotate(-1deg);}
100%{transform:translateY(-45%) translateX(10px) rotate(1deg);}
}

@keyframes pulse{
0%{filter:blur(3px) brightness(1.4);}
50%{filter:blur(6px) brightness(2);}
100%{filter:blur(3px) brightness(1.4);}
}

@keyframes liquid{
0%{transform:scaleX(1) skewX(0deg);}
50%{transform:scaleX(1.05) skewX(3deg);}
100%{transform:scaleX(1) skewX(0deg);}
}

</style>
</head>

<body>

<div class="video-box left">
<video autoplay loop muted playsinline src="https://radiofantasymusic.github.io/FARAlle/argbello.mp4"></video>
<div class="FantasyMusic"></div>
</div>

<div class="video-box right">
<video autoplay loop muted playsinline src="https://radiofantasymusic.github.io/FARAlle/argbello.mp4"></video>
<div class="FantasyMusic"></div>
</div>

<div class="center-area">
<img src="https://xatimg.com/image/C8fBKM4Znxl4.png">
</div>

<script>
/* CAMBIA QUI IL TESTO */
var testoLaterale="Trilly";

document.querySelectorAll(".text").forEach(el=>{
el.innerText=testoLaterale;
});
</script>

</body>
</html>
