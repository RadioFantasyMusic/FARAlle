<html lang="pt-PT"><head>
<title>fmusic:</title>
<meta name="description" content="FM">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta property="og:title" content="FMPlayer">
<meta property="og:description" content="FM">
<link rel="icon" type="image/png" href="https://i.imgur.com/YTsSEle.png" sizes="48x48">
    <style type="text/css">
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            padding-top: 60px; 
            background: #000 url('https://xatimg.com/image/SMEhC043cltX.png') center/cover no-repeat;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0, 255, 0, 0.3) 0%, rgba(255, 255, 0, 0.2) 100%);
            z-index: 1;
            pointer-events: none;
            transition: 1.5s ease-in-out;
        }

        .main-scaler {
            transform: scale(min(1, calc(100vw / 1580), calc(100vh / 950)));
            transform-origin: top center;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            width: 1580px; 
        }

        .stage-area {
            position: relative;
            width: 728px;
            height: 486px;
            margin-top: 39px;
        }

        .theme-nav {
            position: absolute;
            top: -35px; 
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            z-index: 9999;
            padding: 0 5px;
        }

        .theme-nav span {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: radial-gradient(circle at 35% 35%, #fff 0%, var(--c1) 40%, var(--c2) 100%);
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 -2px 5px rgba(0,0,0,0.5);
            transition: 0.3s;
            flex-shrink: 0;
        }

        .dj-wrap {
            position: absolute;
            top: 25px; 
            width: 400px;
            height: 486px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding-top: 110px; 
        }

        .left-dj { left: -370px; }
        .right-dj { right: -390px; }
        
        .dj-wrap img { 
            width: 230px; 
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
            transform: scaleY(1.15); 
            animation: floatAnim 4s ease-in-out infinite;
        }

        .left-dj img {
            width: 260px; 
            margin-left: -70px;
        }

        @keyframes floatAnim { 
            0%, 100% { transform: scaleY(1.15) translateY(0); } 
            50% { transform: scaleY(1.15) translateY(-10px); } 
        }

        .v-label {
            position: absolute;
            font-size: 3.8rem;
            white-space: nowrap;
            z-index: 30;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: -2px;
            margin-top: -110px; 
        }

        .left-dj .v-label { transform: rotate(-90deg); left: -115px; }
        .right-dj .v-label { transform: rotate(90deg); right: -205px; }

        .rainbow {
            background: linear-gradient(to right, #FF0000, #FF00FF, #0000FF, #00FFFF, #00FF00, #FFFF00, #FF0000);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbow-anim 4s linear infinite;
        }
        @keyframes rainbow-anim { to { background-position: 200% center; } }

        .footer-text {
            position: absolute;
            bottom: -90px;
            width: 1200px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 2.3rem;
            font-weight: 900;
            text-shadow: 0 8px 30px rgba(0,0,0,1);
        }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;">

    <div class="bg-overlay" id="overlay"></div>

    <div class="main-scaler">
        <div class="stage-area">
